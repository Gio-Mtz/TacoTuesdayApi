# Build and test the API on every push and every pull request.
#
# Why this file exists: until now nothing built this repository automatically. Claude writes
# the C# but has no .NET SDK and cannot reach the Microsoft package hosts, so the only thing
# standing between "written" and "known to compile" was Gio running two commands by hand on
# every story. This is what replaces that — and, per EQUIPO - Roles y reglas, it is the
# **final judge** on whether a backend story is Done.
#
# It runs on GitHub's runners, so it needs nothing from anybody's machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # No version here on purpose: global.json pins it, and two places to change the SDK
          # version is one place too many.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # --no-restore so this step fails on compilation, not on a network hiccup that already
      # had its own step. TreatWarningsAsErrors is on in Directory.Build.props, so a warning
      # fails the build here — which is the point of turning it on.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # Separate job, because it answers a different question: not "does the code work" but
  # "does the migration still describe the model". Nothing in the test suite can see this —
  # the tests build their schema with EnsureCreated() from the model itself, so a migration
  # that has drifted away from LeadConfiguration.cs keeps every test green and then produces
  # the wrong table on the next deploy.
  #
  # It will fail until the first migration exists. That failure is correct and the fix is one
  # command — see docs/database.md.
  migrations-match-the-model:
    name: Migrations match the model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Same cache key as job 1, on purpose: the two jobs restore the same graph, so whichever
      # one runs second gets a warm cache instead of hitting NuGet again.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # This step is not redundant with job 1. Jobs run on SEPARATE runners with separate
      # filesystems, so nothing job 1 restored exists here — and `dotnet ef` does NOT restore
      # for you. It shells out to MSBuild to read the project's metadata, MSBuild needs
      # obj/project.assets.json to exist, and without it the command dies with
      #   NETSDK1004: Assets file '.../obj/project.assets.json' not found
      #   Unable to retrieve project metadata. Ensure it's an SDK-style project.
      # before it ever looks at the model. That is what broke this job on 29-sep, and the
      # error is misleading: the project is fine, it was simply never restored.
      - name: Restore
        run: dotnet restore

      # Pinned, and pinned to the SAME version as the EF packages in
      # Directory.Packages.props. An unpinned `tool install` takes whatever is newest on
      # NuGet that day, and EF tools older than the runtime refuse to run outright — so an
      # unpinned tool turns "somebody released a package" into "the build broke on a branch
      # nobody touched". When the EF version moves, this moves with it.
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      # --project is the MIGRATIONS assembly, not the module that holds the DbContext. They
      # are two different projects on purpose: see docs/adr/0006-migrations-assembly.md.
      - name: Check for pending model changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Migrations/TacoTuesday.Migrations.SqlServer \
            --startup-project src/TacoTuesday.Api

  # Third job, and the reason it exists is a three-week outage nobody could see.
  #
  # NOTHING in this repository built the Dockerfile. Job 1 builds the solution and job 2 checks
  # the model, and both pass on a Dockerfile that cannot build at all -- because `dotnet restore`
  # inside the image only sees the .csproj files the Dockerfile explicitly COPYs, and the
  # solution build on the runner sees every file in the checkout. The two disagree the moment a
  # story adds a project.
  #
  # That is exactly what happened. US-004 added the Leads module and US-005 added the migrations
  # assembly to the Api project's reference closure; the Dockerfile was not touched; and from
  # that commit on every image build died at restore with
  #
  #   MSB3202: The project file ".../TacoTuesday.Modules.Leads.csproj" was not found.
  #
  # The cost of not having this job: the running revision in Azure kept serving the image built
  # on 09-sep. `/health/live` and `/health/ready` answered Healthy from it -- they are real
  # health checks of a real, old container -- so every signal said the API was fine, while
  # `POST /api/leads` answered **404** because that endpoint had never been shipped. The 404
  # reads like a bug in the endpoint or in the UI. It was neither: it was a build nobody ran.
  #
  # So this job's job is narrow and it is the whole point: prove the Dockerfile still builds.
  # It does NOT push, tag or deploy anything -- no registry credentials live here, and a
  # deployment is Gio's call, not a side effect of a push.
  #
  # It costs a full NuGet restore inside the image on every run (~2 min) because there is no
  # layer cache on a fresh runner. That is the honest trade and it is worth it at this price.
  # If it ever gets annoying, the next step is docker/setup-buildx-action with
  # `cache-from: type=gha` -- deliberately not done today, because a plain `docker build` has
  # no moving parts and this job's value is that it never needs maintenance.
  container-image:
    name: Container image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No setup-dotnet and no restore on the runner on purpose: the SDK that matters is the
      # one inside the image (mcr.microsoft.com/dotnet/sdk:10.0). Anything installed out here
      # would be a second source of truth that hides the very drift this job exists to catch.
      #
      # The full image, not `--target build`: the final stage copies the publish output and
      # sets USER $APP_UID, and a typo there breaks a container that compiled perfectly.
      - name: Build the image
        run: docker build --file Dockerfile --tag tacotuesday-api:ci .
